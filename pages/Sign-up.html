<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../src/style/output.css">
</head>

<body>
    <div class="h-screen flex justify-center items-center">
        <div class="w-96 flex flex-col gap-2 shadow-2xl px-8 py-10 rounded-3xl">
            <h3 class="text-2xl font-semibold mb-4">Creat your account</h3>
            <label class="text-xs font-medium">First Name <span class="text-red-500">*</span>
            </label>
            <input class="w-full p-2 border border-black rounded-xl focus:outline-none focus:ring-2 ring-indigo-600"
                type="text" placeholder="first name">

            <label class="text-xs font-medium">Last Name<span class="text-red-500">*</span>
            </label>
            <input class="w-full p-2 border border-black rounded-xl focus:outline-none focus:ring-2 ring-indigo-600"
                type="text" placeholder="Last Name">

            <label class="text-xs font-medium">Email<span class="text-red-500">*</span>
            </label>
            <input class="w-full p-2 border border-black rounded-xl focus:outline-none focus:ring-2 ring-indigo-600"
                type="text" placeholder="Email">

            <label class="text-xs font-medium">Password<span class="text-red-500">*</span>
            </label>
            <input class="w-full p-2 border border-black rounded-xl focus:outline-none focus:ring-2 ring-indigo-600"
                type="password" placeholder="password">


            <button
                class="bg-black text-white font-semibold w-full py-2 rounded-xl hover:cursor-pointer active:scale-[98%] disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100 mt-6">Creat Account</button>
        </div>
    </div>
</body>

</html>
